aid: clikalia
name: Clikalia
description: 'Clikalia is a Spanish proptech founded in 2018 by Alister Moreno and Pablo Fernandez that
  operates an iBuyer model for residential real estate: it makes homeowners an instant purchase offer,
  can close a sale within days, then renovates and returns properties to the market in turnkey condition.
  The company pairs proprietary technology with a large operations team to digitize a historically slow
  home buying and selling process, and also offers mortgage brokerage (hipotecas) and renovation services
  (Studio by Clikalia). Backed by Fifth Wall and SoftBank Vision Fund, Clikalia operates across Spain,
  Portugal, France and Mexico. Clikalia does not publish a public developer API; this API Evangelist
  profile captures its public web, legal, and domain-security surface.'
